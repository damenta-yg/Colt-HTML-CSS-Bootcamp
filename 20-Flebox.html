<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Lessons</title>
    <style>
      h1 {
        color: red;
      }
      h1 {
        text-align: center;
        font-family: sans-serif;
        font-size: 6rem;
      }
      .container {
        border: 4px solid black;
        width: 1200px;
        margin: 40px auto;
        display: flex;
        flex-direction: row;
        justify-content: flex-end;
      }

      .box {
        width: 150px;
        height: 150px;
        font-size: 4rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Hello World</h1>
    <div class="container">
      <div class="box" style="background-color: #ff5722">1</div>
      <div class="box" style="background-color: #ff9800">2</div>
      <div class="box" style="background-color: #ffc107">3</div>
      <div class="box" style="background-color: #ffeb3b">4</div>
      <div class="box" style="background-color: #cddc39">5</div>
      <div class="box" style="background-color: #8bc34a">6</div>
    </div>
  </body>
  <!-- 
  To do flexbox -> display : flex; (container property / parent properties)
  consist of flex-container and flex-items/child

   -->
</html>

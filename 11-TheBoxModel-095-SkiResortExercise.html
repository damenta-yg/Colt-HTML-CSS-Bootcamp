<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ski Resort Exercise</title>
    <style>
      body {
        font-family: sans-serif;
      }
      h1,
      h2,
      button {
        text-transform: uppercase;
      }
      h1 {
        margin-bottom: 28px;
        font-weight: lighter;
        font-size: 40px;
      }
      h2 {
        color: #a6192e;
      }
      h2,
      p {
        font-size: 28px;
      }
      button {
        padding: 20px 40px;
        background-color: #463d36;
        color: white;
        font-weight: bolder;
        font-size: 24px;
      }

      .outer-container {
        background-color: #463d36;
        padding: 40px;
        height: 100vh;
      }
      .container {
        width: 600px;
        border: 1px solid black;
        padding: 40px;
        margin: 10% auto;
        background-color: white;
        border-radius: 15px;
      }
    </style>
  </head>
  <body>
    <section class="outer-container">
      <div class="container">
        <h2>open daily 9am - 4pm</h2>
        <h1>banana peel now open!</h1>
        <p>
          Winter has seriously delivered so far, and Banana Peel is now open for
          the season!
        </p>
        <button>lift & terrain status</button>
      </div>
    </section>
  </body>
